
name: Extract ZIP Files

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract ZIP
        run: |
          mkdir -p temp
          unzip -oq HR-HABIB-AI-Free-Android-Source.zip -d temp
          cp -a temp/hr-habib-ai-free/. ./
          rm -rf temp

      - name: Save Extracted Files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Extract project files"
          git push
          
